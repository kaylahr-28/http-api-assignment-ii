<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    //for handling fetch response
    const handleResponse = async (response, getRequest) => {

      const content = document.querySelector("#content");

      //heading changes based on status code
      switch (response.status) {
        case 200:
          content.innerHTML = `<b>Success!</b>`;
          break;
        case 201:
          content.innerHTML = `<b>Created!</b>`;
          break;
        case 204:
          content.innerHTML = `<b>Updated! (No Content)`;
          break;
        case 400: content.innerHTML = `<b>Bad Request :(</b>`;
          break;
        case 404: content.innerHTML = `<b>Content Not Found </3</b>`;
          break;
      }

      let obj = await response.json();

      if (getRequest) {
        content.innerHTML += `<p>${JSON.stringify(obj)}</p>`;
      }

    };

    const handleForm = async (form) => {
      //form info
      //methodSelect
      const url = form.getAttribute('action');
      const method = form.getAttribute('method');
      const formData = "";

      //for post
      let name;
      let age;

      //post
      if (form === document.querySelector("#nameForm")) {
        name = document.querySelector("#nameField").value;
        age = document.querySelector("#ageField").value;
        formData = JSON.stringify({ name, age });

      } else if (form === document.querySelector("#userForm")) {

      }



      let response = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Content-Length': formData.length,
          'Accept': 'application/json',
        },

      });

      // if (method !== "get") {
      //   response.body = formData;
      // }

      handleResponse(response, method == "get");
    }


    const init = () => {

      const nameForm = document.querySelector("#nameForm");
      const userForm = document.querySelector("#userForm");

      //prevent default form action
      const addUser = (e) => {
        e.preventDefaut();
        handleForm(nameForm);
        return false;
      }

      //this is get not post, change?
      const getUser = (e) => {
        e.preventDefaut();
        handleForm(userForm);
        return false;
      }

      nameForm.addEventListener('submit', addUser);
      userForm.addEventListener('submit', getUser);
    }

    window.onload = init;

  </script>
</head>

<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1" />
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>

</html>
